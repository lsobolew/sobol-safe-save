memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
; Errors go to the log, never to the HTTP output. Printing even a single warning from
; wp-config.php starts the response before the headers, which stops WordPress from sending the
; Link header pointing at the REST API - and that header is how e2e tooling discovers the API.
; Read the errors in .wplab/logs/wp-<target>.log or in Query Monitor.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
date.timezone = UTC
sendmail_path = "/usr/bin/msmtp -t --read-envelope-from"
opcache.enable = 0
opcache.enable_cli = 0

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(grep -m1 '^\s*\*\s*Version:' plugins/*/[a-z]*.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')"
          if [ "$TAG" != "$HEADER" ]; then
            echo "Tag $TAG does not match the plugin header $HEADER."
            echo "Run ./bin/wpx version $TAG and commit before tagging."
            exit 1
          fi

      - run: ./bin/wpx up latest
      - run: ./bin/wpx build --edition=both --verify

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

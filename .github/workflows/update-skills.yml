name: Update WordPress agent skills

# The skills teach every agent working in this repo how to write WordPress. Pinned and committed,
# they would quietly go stale, so this keeps them fresh and puts every change in a reviewable PR.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update the skill pack
        run: ./bin/wpx skills update

      - name: Open a pull request when something changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-agent-skills
          title: 'chore: update WordPress agent skills'
          commit-message: 'chore: update WordPress agent skills'
          body: |
            Automated update of the official WordPress agent skills
            (https://github.com/WordPress/agent-skills).

            Review the diff under `.claude/skills/` before merging.
          add-paths: |
            .claude/skills/**
            .claude/wplab-skills.lock.json
          delete-branch: true
